name: Playwright Tests
on: pull_request
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      CI: true
      API_URL: ${{ secrets.API_URL }}
      AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
      #COLLECTIONS_API_URL: ${{ secrets.COLLECTIONS_API_URL }}
      #COLLECTIONS_API_AUTH_TOKEN: ${{ secrets.COLLECTIONS_API_AUTH_TOKEN }}
      COLLECTIONS_API_URL: ${{ secrets.QA_COLLECTIONS_API_URL }}
      COLLECTIONS_API_AUTH_TOKEN: ${{ secrets.QA_COLLECTIONS_API_AUTH_TOKEN }}
      NEW_RELIC_ENABLED: false
      SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
      GOOGLE_SHEETS_CLIENT_EMAIL: ${{ secrets.GOOGLE_SHEETS_CLIENT_EMAIL }}
      GOOGLE_SHEETS_PRIVATE_KEY: ${{ secrets.GOOGLE_SHEETS_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run build
        run: npm run build

      - name: Run Playwright tests
        # Explicitly enforce Chromium
        run: npm run playwright -- --project=chromium

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 3
